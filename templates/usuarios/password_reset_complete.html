{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña actualizada — Grupo V&R</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--dark:#0a1628;--blue:#1560BD;--blue2:#3a82e8;--accent:#4fc3f7;--text:#e8edf5;--muted:#8899aa;--border:rgba(255,255,255,0.09);--ff:'Sora',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ff);background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse 60% 50% at 70% 50%,rgba(21,96,189,0.12) 0%,transparent 70%),linear-gradient(135deg,#060f20 0%,#091828 50%,#0a1e38 100%);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(15,30,53,0.95);border:0.5px solid var(--border);border-radius:16px;padding:2.75rem;width:380px;max-width:90vw;animation:fadeInUp .6s ease both;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;}
.icon-ok{width:56px;height:56px;border-radius:50%;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;}
.title{font-size:20px;font-weight:600;color:#fff;margin-bottom:8px;}
.subtitle{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:1.75rem;}
.btn-login{display:block;width:100%;background:var(--blue);color:#fff;border:none;padding:13px;border-radius:8px;font-size:14px;font-family:var(--ff);cursor:pointer;font-weight:600;transition:all .2s;box-shadow:0 4px 14px rgba(21,96,189,.35);text-decoration:none;box-sizing:border-box;}
.btn-login:hover{background:var(--blue2);}
</style>
</head>
<body>
<div class="card">
  <div class="icon-ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></div>
  <div class="title">Contraseña actualizada</div>
  <div class="subtitle">Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con tu nueva contraseña.</div>
  <a href="{% url 'usuarios:login' %}" class="btn-login">Ir al inicio de sesión</a>
</div>
</body>
</html>
