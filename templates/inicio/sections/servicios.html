{% load static %}

<div class="sec" id="servicios">

    <div class="sec-tag">
        Lo que ofrecemos
    </div>

    <h2 class="sh">
        Soluciones integrales para cada etapa de tu vida
    </h2>

    <div class="uline"></div>

    <div class="svc-grid">

        {% if servicios %}

            {% for s in servicios %}

                <div class="svc-card">

                    <div class="svc-img-wrap">

                        {% if s.imagen %}
                            <img src="{{ s.imagen.url }}" class="svc-img">
                        {% else %}
                            <img src="{% static 'img/default-servicio.jpg' %}" class="svc-img">
                        {% endif %}

                    </div>

                    <div class="svc-body">

                        <h3>{{ s.nombre }}</h3>

                        <p>{{ s.descripcion_corta }}</p>

                        <a href="/servicios/" class="svc-link">
                            Ver más →
                        </a>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <!-- AQUÍ DEJAS TODOS TUS SERVICIOS ESTÁTICOS QUE YA TENÍAS -->

        {% endif %}

    </div>

</div>
