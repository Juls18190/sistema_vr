{% load static %}

<div class="sec" id="servicios">

    <div class="sec-tag">
        Lo que ofrecemos
    </div>

    <h2 class="sh">
        Soluciones integrales para cada etapa de tu vida
    </h2>

    <div class="uline"></div>

    <div class="svc-grid">

        {% if servicios %}

            {% for s in servicios %}

                <div class="svc-card">

                    {% if s.imagen %}
                        <div class="svc-img-wrap">
                            <img src="{{ s.imagen.url }}" class="svc-img" alt="{{ s.nombre }}">
                        </div>
                    {% else %}
                        <div class="svc-img-wrap svc-img-wrap-vacio">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                    {% endif %}

                    <div class="svc-body">

                        <h3>{{ s.nombre }}</h3>

                        <p>{{ s.descripcion_corta }}</p>

                        <a href="/servicios/" class="svc-link">
                            Ver más →
                        </a>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <!-- AQUÍ DEJAS TODOS TUS SERVICIOS ESTÁTICOS QUE YA TENÍAS -->

        {% endif %}

    </div>

</div>
